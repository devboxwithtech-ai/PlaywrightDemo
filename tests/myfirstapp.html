  <!-- Product Card Filtering -->
  <ul role="list">
    <li role="listitem">
      <h3 role="heading">Product 1</h3>
      <button role="button">Add to cart</button>
    </li>
    <li role="listitem">
      <h3 role="heading">Product 2</h3>
      <button role="button">Add to cart</button>
    </li>
    <li role="listitem">
      <h3 role="heading">Product 3</h3>
      <span>Out of stock</span>
    </li>
  </ul>

  <!-- List of Fruits -->
  <ul role="list">
    <li role="listitem" data-testid="apple">apple</li>
    <li role="listitem" data-testid="banana">banana</li>
    <li role="listitem" data-testid="orange">orange</li>
  </ul>

  <!-- John/Mary Filter Combo -->
  <ul role="list">
    <li role="listitem">
      <div>John</div>
      <div><button role="button">Say hello</button></div>
    </li>
    <li role="listitem">
      <div>Mary</div>
      <div><button role="button">Say hello</button></div>
    </li>
    <li role="listitem">
      <div>John</div>
      <div><button role="button">Say goodbye</button></div>
    </li>
    <li role="listitem">
      <div>Mary</div>
      <div><button role="button">Say goodbye</button></div>
    </li>
  </ul>

  <!-- Visibility Test -->
  <button style="display: none">Invisible</button>
  <button>Visible</button>

  <!-- Optional Dialog Example -->
  <div data-testid="settings-dialog" style="display: none">Confirm security settings
    <button role="button">Dismiss</button>
  </div>
  <button role="button" title="Subscribe">Subscribe</button>
  <button role="button">New</button>
</body>
